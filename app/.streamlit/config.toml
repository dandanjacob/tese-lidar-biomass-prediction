[theme]
primaryColor = "#4a90d9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a1a2e"
font = "sans serif"

[server]
headless = true
# recarrega o app no navegador automaticamente ao salvar qualquer arquivo .py
runOnSave = true

[runner]
# reexecuta de forma rápida assim que o código muda
fastReruns = true
