[theme]
primaryColor = "#2E6B4E"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7f4"
textColor = "#18211c"
font = "sans serif"

[server]
headless = true
# recarrega o app no navegador automaticamente ao salvar qualquer arquivo .py
runOnSave = true

[runner]
# reexecuta de forma rápida assim que o código muda
fastReruns = true
